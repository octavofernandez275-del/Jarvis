name: JARVIS Android ARM64

on:
  push:
    branches: ["**"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar JARVIS
        uses: actions/checkout@v4

      - name: Preparar Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Preparar Android SDK y NDK
        uses: android-actions/setup-android@v4

      - name: Instalar herramientas Android
        run: |
          sdkmanager "platforms;android-34" \
            "build-tools;34.0.0" \
            "ndk;27.2.12479018" \
            "cmake;3.22.1"

      - name: Descargar llama.cpp
        uses: actions/checkout@v4
        with:
          repository: ggml-org/llama.cpp
          path: llama.cpp
          submodules: recursive

      - name: Compilar servidor nativo ARM64
        env:
          ANDROID_NDK_HOME: ${{ env.ANDROID_NDK_HOME }}
        run: |
          set -eux
          NDK="${ANDROID_SDK_ROOT}/ndk/27.2.12479018"
          test -f "$NDK/build/cmake/android.toolchain.cmake"

          cmake -S llama.cpp -B llama.cpp/build-android \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_TOOLCHAIN_FILE="$NDK/build/cmake/android.toolchain.cmake" \
            -DANDROID_ABI=arm64-v8a \
            -DANDROID_PLATFORM=android-26 \
            -DANDROID_STL=c++_static \
            -DGGML_NATIVE=OFF \
            -DGGML_OPENMP=OFF \
            -DGGML_LLAMAFILE=OFF \
            -DLLAMA_OPENSSL=OFF \
            -DBUILD_SHARED_LIBS=OFF \
            -DLLAMA_BUILD_SERVER=ON \
            -DLLAMA_BUILD_TESTS=OFF \
            -DLLAMA_BUILD_EXAMPLES=OFF

          cmake --build llama.cpp/build-android \
            --target llama-server --parallel 2

          BIN="$(find llama.cpp/build-android -type f \
            -name llama-server -perm -u+x | head -n 1)"
          test -n "$BIN"
          test -f "$BIN"

          mkdir -p app/src/main/jniLibs/arm64-v8a
          cp "$BIN" \
            app/src/main/jniLibs/arm64-v8a/libllama_server.so
          chmod 755 \
            app/src/main/jniLibs/arm64-v8a/libllama_server.so


      - name: Instalar Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Compilar APK
        run: gradle assembleDebug --no-daemon --stacktrace

      - name: Publicar APK
        uses: actions/upload-artifact@v4
        with:
          name: jarvis-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
