name: Compilar APK JARVIS

on:
  push:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: jarvis-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Obtener código
        uses: actions/checkout@v4

      - name: Configurar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Instalar Android SDK y NDK
        uses: android-actions/setup-android@v3

      - name: Instalar herramientas Android
        run: sdkmanager "platforms;android-34" "build-tools;34.0.0" "ndk;27.2.12479018" "cmake;3.22.1"

      - name: Configurar Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'

      - name: Verificar estructura e integración AUTOPILOT 2.0
        run: |
          python3 - <<'PYCODE'
          import pathlib, xml.etree.ElementTree as ET
          root = pathlib.Path('.')
          ET.parse(root / 'app/src/main/AndroidManifest.xml')
          required = [
            'app/src/main/java/com/octavo/jarvis/Autopilot.kt',
            'app/src/main/java/com/octavo/jarvis/Autopilot2Modules.kt',
            'app/src/main/java/com/octavo/jarvis/MissionWorker.kt',
            'app/src/main/java/com/octavo/jarvis/Engine.kt',
            'app/src/main/res/xml/file_paths.xml',
          ]
          missing = [p for p in required if not (root / p).is_file()]
          if missing:
            raise SystemExit('Faltan archivos: ' + ', '.join(missing))
          manifest = ET.parse(root / 'app/src/main/AndroidManifest.xml').getroot()
          ns = {'a': 'http://schemas.android.com/apk/res/android'}
          names = {node.attrib.get('{http://schemas.android.com/apk/res/android}name', '') for node in manifest.findall('.//activity')}
          for activity in ['.AutopilotActivity', '.CreativeStudioActivity', '.DeveloperEngineActivity', '.JarvisMemoryActivity', '.MainActivity']:
            if activity not in names:
              raise SystemExit('Actividad no declarada en manifest: ' + activity)
          gradle = (root / 'app/build.gradle.kts').read_text()
          for dependency in ['androidx.work:work-runtime-ktx', 'androidx.core:core-ktx']:
            if dependency not in gradle:
              raise SystemExit('Falta dependencia: ' + dependency)
          print('Estructura, actividades, FileProvider y manifiesto XML correctos')
          PYCODE

      - name: Obtener llama.cpp
        run: git clone --depth 1 https://github.com/ggml-org/llama.cpp.git

      - name: Compilar llama-server para Android arm64
        shell: bash
        run: |
          set -euo pipefail
          NDK="$ANDROID_HOME/ndk/27.2.12479018"
          cmake -S llama.cpp -B build-llama \
            -DCMAKE_TOOLCHAIN_FILE="$NDK/build/cmake/android.toolchain.cmake" \
            -DANDROID_ABI=arm64-v8a \
            -DANDROID_PLATFORM=android-28 \
            -DANDROID_STL=c++_static \
            -DCMAKE_BUILD_TYPE=Release \
            -DBUILD_SHARED_LIBS=OFF \
            -DGGML_OPENMP=OFF \
            -DGGML_NATIVE=OFF \
            -DLLAMA_CURL=OFF \
            -DLLAMA_BUILD_TESTS=OFF \
            -DLLAMA_BUILD_SERVER=ON \
            -DCMAKE_EXE_LINKER_FLAGS="-Wl,-z,max-page-size=16384"
          cmake --build build-llama --target llama-server --parallel 2
          test -x build-llama/bin/llama-server
          mkdir -p app/src/main/jniLibs/arm64-v8a
          cp build-llama/bin/llama-server app/src/main/jniLibs/arm64-v8a/libllama_server.so
          chmod 755 app/src/main/jniLibs/arm64-v8a/libllama_server.so
          test -x app/src/main/jniLibs/arm64-v8a/libllama_server.so

      - name: Compilar APK debug
        run: gradle assembleDebug --no-daemon --stacktrace

      - name: Verificar APK generado
        run: |
          set -euo pipefail
          APK="app/build/outputs/apk/debug/app-debug.apk"
          test -s "$APK"
          ls -lh "$APK"
          echo "APK generado correctamente: $APK" >> "$GITHUB_STEP_SUMMARY"

      - name: Publicar APK
        uses: actions/upload-artifact@v4
        with:
          name: JARVIS-AUTOPILOT-2.0-APK
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
